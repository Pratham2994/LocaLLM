# Sampling presets. Configs refer to these by name (`sampling: qwen35-nothink-general`)
# or give the values inline. Every request sends all of them explicitly, because
# llama-server's own defaults (temp 0.8, top_k 40, min_p 0.05) are not what the model cards say.

# Qwen3.5 official model card (LOCAL_LLM_LAB.md section 5.3)
qwen35-think-general:     {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5, repeat_penalty: 1.0}
qwen35-think-coding:      {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}
qwen35-nothink-general:   {temperature: 0.7, top_p: 0.8,  top_k: 20, min_p: 0.0, presence_penalty: 1.5, repeat_penalty: 1.0}
qwen35-nothink-reasoning: {temperature: 1.0, top_p: 1.0,  top_k: 40, min_p: 0.0, presence_penalty: 2.0, repeat_penalty: 1.0}

# Only for "do two engines give the same answer?" sanity checks. Never for quality tests
# on thinking models (greedy decoding causes repetition loops).
greedy-sanity:            {temperature: 0.0, top_p: 1.0,  top_k: 1,  min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}

# Gemma 4 E4B: values stored in the GGUF itself (general.sampling.*), read 2026-09-24.
gemma4-card:              {temperature: 1.0, top_p: 0.95, top_k: 64, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}

# Phi-4-mini-instruct: no thinking mode, no sampling in the GGUF; the model card's example uses
# greedy decoding (temperature 0). Fine here: it is not a thinking model.
phi4-mini-card:           {temperature: 0.0, top_p: 1.0,  top_k: 40, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}

# PC models (model cards read 2026-10-02).
# Qwen3.8-27B thinking mode: temp 1.0, top_p 0.95, top_k 20, presence 0 (its non-thinking values equal qwen35-nothink-general).
qwen38-think:             {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}
# Ornith-1.5 (9B and 35B-A3B): "for general tasks" temp 0.6, top_p 0.95, top_k 20.
ornith15-card:            {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}
# empero-ai Qwen3.8-35B-A3B-Distill: temp 0.6, top_p 0.95, top_k 20 (same values as Ornith).
empero-distill-card:      {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}
# poolside Laguna XS 2.1: temp 1.0, top_k 20, top_p 1.
laguna-card:              {temperature: 1.0, top_p: 1.0,  top_k: 20, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}
# OpenAI gpt-oss-20b: temp 1.0, top_p 1.0, no top_k (0 = off in llama.cpp).
gptoss-card:              {temperature: 1.0, top_p: 1.0,  top_k: 0,  min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}
