- id: hard-py-ttl-cache
  category: small_function
  thinking: off
  check: python_tests
  entry: TTLCache
  notes: Three traps. get() must not extend the expiry; expired entries are purged BEFORE evicting, so a live least-recently-used entry survives; an entry is expired at exactly now == expiry.
  prompt: |
    Write a Python class `TTLCache` for a pricing service. All times are whole seconds passed
    in by the caller as `now`; calls always come with non-decreasing `now`.

    - `TTLCache(capacity: int, ttl: int)`: holds at most `capacity` entries.
    - `put(key, value, now: int) -> None`: stores or replaces the value. The entry's expiry
      time becomes `now + ttl` and the key becomes the most recently used.
    - `get(key, now: int)`: returns the value, or `None` if the key is missing or expired.
      An entry is expired when `now >= expiry time`. A successful `get` makes the key the
      most recently used, but does NOT change its expiry time.
    - When `put` adds a NEW key and the cache is full: first remove every entry that is
