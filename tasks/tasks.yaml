    assert satisfies("0.3.5", ">=1.0.0 <2.0.0 || ^0.3.1")
    assert satisfies("1.5.0", ">=1.0.0 <2.0.0   ||   ^0.3.1")
    assert not satisfies("0.4.0", ">=1.0.0 <2.0.0 || ^0.3.1")
