    assert merge_slots([(60, 90), (90, 120)]) == [(60, 120)]
    assert merge_slots([(300, 360), (60, 120), (100, 150), (10, 20)]) == [(10, 20), (60, 150), (300, 360)]
    assert merge_slots([(0, 500), (100, 200), (450, 600)]) == [(0, 600)]
