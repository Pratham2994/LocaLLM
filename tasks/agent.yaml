  - id: ag-py-parse-env
    kind: repo
    category: agent-feature
    lang: python
    prompt: Implement `parse_env` in config/parse.py as its docstring describes. Run the tests when you are done.
    files:
      config/__init__.py: ""
      config/parse.py: |
        def parse_env(text):
            """Parse the text of a .env file into a dict of strings.

            Rules:
            - One `KEY=VALUE` per line. Spaces around the key and around the value are removed.
            - Blank lines and lines whose first non-space character is `#` are ignored.
            - A line may start with `export ` (the word and a space); that prefix is ignored.
            - Only the first `=` splits the line, so a value may contain `=`.
            - A value in double quotes loses the quotes and keeps everything between them,
              spaces included. An empty value is allowed and gives an empty string.
            - A key must start with a capital letter or `_` and hold only capital letters,
              digits and `_`. Any other key raises ValueError.
            - A line that is not blank, not a comment and has no `=` raises ValueError.
            - The message of every ValueError contains `line N`, where N is the number of the
              line in the text, counted from 1 (blank lines and comments count too).
            - If a key appears more than once, the last value wins.
