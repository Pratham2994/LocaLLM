    assert.deepStrictEqual(run([{ op: "add", path: "/a/b/0", value: 9 }]).a.b, [9, 1, 2, 3]);
    assert.deepStrictEqual(run([{ op: "replace", path: "/a/b/0", value: 7 }]).a.b, [7, 2, 3]);
    assert.deepStrictEqual(run([{ op: "remove", path: "/a/b/1" }]).a.b, [1, 3]);
    assert.deepStrictEqual(run([{ op: "add", path: "/a/c", value: { d: 1 } }]).a, { b: [1, 2, 3], c: { d: 1 } });
    assert.deepStrictEqual(run([{ op: "add", path: "/a/b", value: "x" }]).a, { b: "x" });
    assert.deepStrictEqual(run([{ op: "replace", path: "/x~1y", value: 5 }]), { a: { b: [1, 2, 3] }, "x/y": 5, "m~n": 2 });
    assert.deepStrictEqual(run([{ op: "remove", path: "/m~0n" }]), { a: { b: [1, 2, 3] }, "x/y": 1 });
    assert.deepStrictEqual(
      run([{ op: "add", path: "/c", value: {} }, { op: "add", path: "/c/d", value: [0] }, { op: "add", path: "/c/d/-", value: 1 }, { op: "remove", path: "/a" }]),
      { "x/y": 1, "m~n": 2, c: { d: [0, 1] } });
    assert.deepStrictEqual(run([{ op: "add", path: "", value: 5 }]), 5);
    assert.deepStrictEqual(run([]), doc);
    for (const bad of [
      [{ op: "remove", path: "/nope" }],
      [{ op: "replace", path: "/a/zz", value: 1 }],
      [{ op: "add", path: "/a/b/5", value: 1 }],
      [{ op: "remove", path: "/a/b/3" }],
      [{ op: "add", path: "/q/r", value: 1 }],
      [{ op: "add", path: "/a/b/x", value: 1 }],
      [{ op: "move", path: "/a", value: 1 }],
