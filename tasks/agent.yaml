    kind: repo
    category: agent-project-feature
    lang: python
    base: depot
    max_steps: 50
    prompt: Implement the price list feature that README.md describes in its section "Price lists". run_tests.py shows a small part of the expected behaviour.
    mutate: &id028
    - path: README.md
      old: |
        ### Reports
      new: |
        ### Price lists

        - `Catalog.apply_price_list(text)` changes unit prices from a text with one `SKU,PRICE` pair per line, for example
          `TL-200,19.50`.
        - The first line that is not blank must be the header `sku,price` (any letter case; spaces around the two names
          are allowed); otherwise `ValueError`.
        - Blank lines are ignored. Spaces around the SKU and around the price are ignored.
        - The price is read with `money.parse_price`. A price of 0 is not allowed.
        - A data line that does not have exactly two fields, or whose price is not valid, makes the whole call fail with
          `ValueError`; the message contains `line N`, where N is the number of that line in the text, counted from 1
          (blank lines count). No price is changed then.
        - A SKU that is not in the catalog is not an error: it is skipped and reported.
        - If a SKU appears more than once, the last line wins.
        - The call returns `(changed, unknown)`: `changed` is the number of products whose price is now different from
          before the call, and `unknown` is the list of the unknown SKUs in the order of their first appearance, each once.
        - `Product` objects stay immutable: the catalog puts a new `Product` in place of the old one. An order that was
          placed before the call keeps its prices.
        - Command line: `prices FILE` reads the file (UTF-8), applies it, and prints the line `changed N` followed by one
          line `unknown SKU` for each unknown SKU.

        ### Reports
