        const { titleCase, slugify, truncate } = require('./src/text.js');

        assert.equal(titleCase('the lord of the rings'), 'The Lord of the Rings');
        assert.equal(titleCase('hello WORLD'), 'Hello World');
        assert.equal(titleCase('  a tale   of two cities '), 'A Tale of Two Cities');
        assert.equal(titleCase('war AND peace'), 'War and Peace');
        assert.equal(titleCase('IN the heart of THE sea'), 'In the Heart of the Sea');
        assert.equal(titleCase('an inspector calls'), 'An Inspector Calls');
        assert.equal(titleCase(''), '');
        assert.equal(titleCase('    '), '');
        assert.equal(titleCase('x'), 'X');
        assert.equal(slugify(' Hello  World '), 'hello-world');
        assert.equal(truncate('abcdef', 4), 'abc…');
        console.log('OK: 11 checks');
    reference:
      src/text.js: |
        const SMALL = new Set(['a', 'an', 'the', 'of', 'and', 'in']);

        function slugify(text) {
          return text.trim().toLowerCase().split(/\s+/).join('-');
        }

        function truncate(text, max) {
          return text.length <= max ? text : text.slice(0, max - 1) + '…';
        }

        function titleCase(text) {
          const words = text.trim().split(/ +/).filter(Boolean);
          return words
            .map((word, i) => {
              const lower = word.toLowerCase();
              if (i > 0 && SMALL.has(lower)) return lower;
              return lower[0].toUpperCase() + lower.slice(1);
            })
            .join(' ');
        }

        module.exports = { slugify, truncate, titleCase };
    notes: >-
      JavaScript feature from a README. Traps: several spaces, small words in upper case in the input,
      a small word as the first word, the empty string, and keeping the two old exports.

