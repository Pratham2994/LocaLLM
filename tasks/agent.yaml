        patch:
        - old: |
            from depot.errors import UnknownSku
          new: |
            from dataclasses import replace

            from depot.errors import UnknownSku
            from depot.money import parse_price
        - old: '    def search(self, text):'
          new: |2-
                def apply_price_list(self, text):
                    """Change unit prices from `SKU,PRICE` lines; returns (changed, unknown). Rules: README.md, "Price lists"."""
                    rows = [(number, line.strip()) for number, line in enumerate(text.splitlines(), 1) if line.strip()]
                    if not rows or [part.strip().casefold() for part in rows[0][1].split(",")] != ["sku", "price"]:
                        raise ValueError("the price list must start with the header sku,price")
                    prices, unknown = {}, []
                    for number, line in rows[1:]:   # read everything first: a failed call changes no price
                        parts = [part.strip() for part in line.split(",")]
                        if len(parts) != 2:
                            raise ValueError(f"line {number}: expected SKU,PRICE")
                        try:
                            pence = parse_price(parts[1])
                        except ValueError:
                            raise ValueError(f"line {number}: not a valid price: {parts[1]!r}") from None
                        if pence == 0:
                            raise ValueError(f"line {number}: a price of 0 is not allowed")
                        if parts[0] in self._by_sku:
                            prices[parts[0]] = pence
                        elif parts[0] not in unknown:
                            unknown.append(parts[0])
                    changed = 0
                    for sku, pence in prices.items():
                        if self._by_sku[sku].unit_price_pence != pence:
                            self._by_sku[sku] = replace(self._by_sku[sku], unit_price_pence=pence)
                            changed += 1
                    return changed, unknown

                def search(self, text):
