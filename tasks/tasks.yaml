  tests: |
    from datetime import date
    assert parse_date("2025-03-07") == date(2025, 3, 7)
    assert parse_date("07/03/2025") == date(2025, 3, 7)
    assert parse_date("7 Mar 2025") == date(2025, 3, 7)
    assert parse_date("07 Mar 2025") == date(2025, 3, 7)
    assert parse_date("  2024-12-31 ") == date(2024, 12, 31)
    assert parse_date("12/01/2025") == date(2025, 1, 12), "day must come first"
    for bad in ["31/02/2025", "2025/03/07", "March 7 2025", "", "7 Mar 25", "13/13/2025"]:
