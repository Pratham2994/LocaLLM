      inventory/stock.py: |
        class Stock:
            """Tracks units on hand per SKU. See README.md for the reservation rules."""

            def __init__(self):
                self._on_hand = {}
                self._reserved = {}

            def add(self, sku, qty):
                if qty <= 0:
                    raise ValueError("qty must be positive")
                self._on_hand[sku] = self._on_hand.get(sku, 0) + qty

            def on_hand(self, sku):
                return self._on_hand.get(sku, 0)

            def available(self, sku):
                return self.on_hand(sku) - self._reserved.get(sku, 0)

            def reserve(self, sku, qty):
                if qty <= 0:
                    raise ValueError("qty must be positive")
                if qty > self.available(sku):
                    raise ValueError("not enough stock available")
                self._reserved[sku] = self._reserved.get(sku, 0) + qty

            def release(self, sku, qty):
                if qty <= 0:
                    raise ValueError("qty must be positive")
                if qty > self._reserved.get(sku, 0):
                    raise ValueError("more than the reserved units")
                self._reserved[sku] -= qty

            def remove(self, sku, qty):
                if qty <= 0:
                    raise ValueError("qty must be positive")
                if qty > self.available(sku):
                    raise ValueError("not enough stock")
                self._on_hand[sku] -= qty
    notes: >-
      A feature from a written spec. The visible tests cover reserve and available only; release and the
      changed rule for remove are in the README. A model that codes to the three visible checks fails.

