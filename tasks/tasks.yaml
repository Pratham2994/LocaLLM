  reference: |
    ```javascript
    function applyPatch(doc, ops) {
      let root = structuredClone(doc);
      const segments = (path) => {
        if (path === "") return [];
        if (path[0] !== "/") throw new Error("bad path: " + path);
        return path.slice(1).split("/").map((s) => s.replace(/~1/g, "/").replace(/~0/g, "~"));
      };
      const index = (seg, max, allowDash) => {
        if (allowDash && seg === "-") return max;
        if (!/^\d+$/.test(seg)) throw new Error("bad array index: " + seg);
        const i = Number(seg);
        if (i > max) throw new Error("array index out of range: " + seg);
        return i;
      };
      const isObject = (x) => x !== null && typeof x === "object" && !Array.isArray(x);
      for (const { op, path, value } of ops) {
        if (!["add", "remove", "replace"].includes(op)) throw new Error("unknown op: " + op);
        const segs = segments(path);
        if (segs.length === 0) {
          if (op === "remove") throw new Error("cannot remove the whole document");
          root = structuredClone(value);
          continue;
        }
        let parent = root;
        for (const seg of segs.slice(0, -1)) {
          if (Array.isArray(parent)) parent = parent[index(seg, parent.length - 1, false)];
          else if (isObject(parent) && Object.hasOwn(parent, seg)) parent = parent[seg];
          else throw new Error("missing parent: " + path);
        }
        const last = segs[segs.length - 1];
        if (Array.isArray(parent)) {
          if (op === "add") parent.splice(index(last, parent.length, true), 0, structuredClone(value));
          else if (op === "remove") parent.splice(index(last, parent.length - 1, false), 1);
          else parent[index(last, parent.length - 1, false)] = structuredClone(value);
        } else if (isObject(parent)) {
          if (op !== "add" && !Object.hasOwn(parent, last)) throw new Error("missing target: " + path);
          if (op === "remove") delete parent[last];
          else parent[last] = structuredClone(value);
        } else {
          throw new Error("missing parent: " + path);
        }
      }
      return root;
    }
    ```
