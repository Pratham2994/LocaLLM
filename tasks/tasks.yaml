  notes: Traps are numeric comparison (1.10.0 > 1.9.0), the caret rule for 0.x and 0.0.x, and OR between alternatives with AND inside one.
  prompt: |
    Write a Python function `satisfies(version: str, range_: str) -> bool` for a package
    installer.

    - A version is `MAJOR.MINOR.PATCH` with non-negative whole numbers, compared number by
      number (so `1.10.0` is greater than `1.9.0`).
    - A range is one or more alternatives separated by `||`. The version satisfies the range
      if it satisfies at least one alternative.
    - An alternative is one or more comparators separated by spaces. The version must satisfy
      all of them.
    - Comparators:
      - `1.2.3` or `=1.2.3`: exactly that version
      - `>1.2.3`, `>=1.2.3`, `<1.2.3`, `<=1.2.3`
      - `~1.2.3`: `>=1.2.3` and `<1.3.0`
      - `^1.2.3`: `>=1.2.3` and `<2.0.0`
      - `^0.2.3`: `>=0.2.3` and `<0.3.0` (major is 0: only the patch may grow)
      - `^0.0.3`: `>=0.0.3` and `<0.0.4` (major and minor are 0: nothing may grow)
    - Extra spaces around `||` and between comparators are allowed.

