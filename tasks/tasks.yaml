- id: bug-py-paginate
  category: bug_finding
  thinking: both
  check: python_tests
  entry: Paginator
  notes: page_count floors instead of rounding up, so the last partial page is unreachable.
  prompt: |
    This Python module has exactly one bug. Find it and fix it.

    ```python
    from dataclasses import dataclass


    @dataclass
    class Page:
        number: int
        items: list
        has_next: bool


    class Paginator:
        """Splits a list of search results into 1-based pages."""

        def __init__(self, items: list, page_size: int):
            if page_size < 1:
                raise ValueError("page_size must be >= 1")
            self.items = items
            self.page_size = page_size

        @property
        def page_count(self) -> int:
            return len(self.items) // self.page_size

        def get_page(self, number: int) -> Page:
            if number < 1 or number > max(self.page_count, 1):
                raise ValueError(f"page {number} out of range")
            start = (number - 1) * self.page_size
            end = start + self.page_size
            return Page(
                number=number,
                items=self.items[start:end],
                has_next=number < self.page_count,
            )
    ```

    Reply with the complete fixed module in one ```python code block, then explain the bug
    in one sentence.
  tests: |
    p = Paginator(list(range(10)), 3)
    assert p.page_count == 4
    assert p.get_page(1).items == [0, 1, 2]
    assert p.get_page(4).items == [9]
    assert p.get_page(4).has_next is False
    assert p.get_page(3).has_next is True
    assert Paginator(list(range(9)), 3).page_count == 3
    assert Paginator([], 5).page_count == 0
    assert Paginator([], 5).get_page(1).items == []
    try:
        p.get_page(5)
    except ValueError:
        pass
    else:
        raise AssertionError("page 5 of 4 should raise")
  reference: |
    ```python
    from dataclasses import dataclass


    @dataclass
    class Page:
        number: int
        items: list
        has_next: bool


    class Paginator:
        def __init__(self, items: list, page_size: int):
            if page_size < 1:
                raise ValueError("page_size must be >= 1")
            self.items = items
            self.page_size = page_size

        @property
        def page_count(self) -> int:
            return -(-len(self.items) // self.page_size)

        def get_page(self, number: int) -> Page:
            if number < 1 or number > max(self.page_count, 1):
                raise ValueError(f"page {number} out of range")
            start = (number - 1) * self.page_size
            return Page(number, self.items[start:start + self.page_size], number < self.page_count)
    ```
    `page_count` rounded down, so a last partial page was lost; it must round up.
  wrong: |
    ```python
    from dataclasses import dataclass


    @dataclass
    class Page:
        number: int
        items: list
        has_next: bool


    class Paginator:
        def __init__(self, items: list, page_size: int):
            self.items = items
            self.page_size = page_size

        @property
        def page_count(self) -> int:
            return len(self.items) // self.page_size

        def get_page(self, number: int) -> Page:
            if number < 1 or number > max(self.page_count, 1):
                raise ValueError(f"page {number} out of range")
            start = (number - 1) * self.page_size
            return Page(number, self.items[start:start + self.page_size], number < self.page_count)
    ```

