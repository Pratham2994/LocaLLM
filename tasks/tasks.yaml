  prompt: |
    A meeting-room booking service stores busy slots as `(start, end)` tuples of minutes
    since midnight, with `start < end`. Write a Python function
    `merge_slots(slots: list[tuple[int, int]]) -> list[tuple[int, int]]` that merges slots
