        patch:
        - old: |
            CANCELLABLE = ("placed", "picked")
          new: |
            CANCELLABLE = ("placed", "picked")
            RETURNABLE = ("delivered", "part-returned")
            RETURNS_WAREHOUSE = "leeds"
        - old: '    def estimate(self, order_id):'
          new: |2-
                def return_items(self, order_id, items):
                    """Take back units of a delivered order and return the refund in pence (README.md, "Returns")."""
                    order = self.get(order_id)
                    if order.status not in RETURNABLE:
                        raise InvalidOrder(f"an order with status {order.status} cannot have returns")
                    lines = {line.sku: line for line in order.lines}
                    seen = set()
                    for item in items:   # check everything first: a refused return changes nothing
                        if item.sku not in lines or item.sku in seen:
                            raise InvalidOrder(f"{item.sku}: not a line of this order, or named twice")
                        seen.add(item.sku)
                        if not isinstance(item.qty, int) or isinstance(item.qty, bool) or item.qty < 1:
                            raise InvalidOrder(f"{item.sku}: the quantity must be a whole number of 1 or more")
                        if order.returned.get(item.sku, 0) + item.qty > lines[item.sku].qty:
                            raise InvalidOrder(f"{item.sku}: more units returned than ordered")
                    refund = 0
                    for item in items:
                        line = lines[item.sku]
                        refund += line.total_pence * item.qty // line.qty + line.vat_pence * item.qty // line.qty
                        order.returned[item.sku] = order.returned.get(item.sku, 0) + item.qty
                        self.inventory.receive(item.sku, RETURNS_WAREHOUSE, item.qty)
                    order.refunded_pence += refund
                    complete = all(order.returned.get(line.sku, 0) == line.qty for line in order.lines)
                    order.status = "returned" if complete else "part-returned"
                    return refund

                def estimate(self, order_id):
