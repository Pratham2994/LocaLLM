    ```python
    from collections import OrderedDict


    class TTLCache:
        def __init__(self, capacity: int, ttl: int):
            self.capacity = capacity
            self.ttl = ttl
            self._data = OrderedDict()  # key -> (value, expiry); last = most recently used

        def put(self, key, value, now: int) -> None:
            if key not in self._data and len(self._data) >= self.capacity:
                for k in [k for k, (_, exp) in self._data.items() if now >= exp]:
                    del self._data[k]
                if len(self._data) >= self.capacity:
                    self._data.popitem(last=False)
            self._data[key] = (value, now + self.ttl)
            self._data.move_to_end(key)

        def get(self, key, now: int):
            item = self._data.get(key)
            if item is None or now >= item[1]:
                return None
            self._data.move_to_end(key)
            return item[0]

        def size(self, now: int) -> int:
            return sum(1 for _, exp in self._data.values() if now < exp)
    ```
