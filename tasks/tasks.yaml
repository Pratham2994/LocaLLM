      by `/`, for example `/servers/0/port`.
    - Inside a segment, `~1` stands for `/` and `~0` stands for `~`.
    - A segment that addresses an array element must be a non-negative whole number.

    Operations:
    - `add`: on an object, set the member (replacing an existing one). On an array, INSERT
      the value before the given index; the index may equal the array length, and `-` means
      "append at the end". With path `""`, the value becomes the whole document.
    - `remove`: delete the object member or the array element (later elements move up).
      The target must exist.
    - `replace`: set a new value. The target must exist.

    Throw an `Error` for anything invalid: an unknown `op`, a parent that does not exist,
    a missing target for `remove` or `replace`, or an array index out of range.

