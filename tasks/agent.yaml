  - id: ag-py-add-reservations
    kind: repo
    category: agent-feature
    lang: python
    prompt: Implement the reservation feature that README.md describes. The tests in run_tests.py show some of the expected behaviour.
    files:
      README.md: |
        # Inventory

        `Stock` tracks the units on hand for each SKU.

        ## Reservations (to be implemented)

        - `reserve(sku, qty)` holds units for an order. It does not change `on_hand`.
        - `available(sku)` returns the units on hand minus the reserved units.
        - `release(sku, qty)` gives reserved units back.
        - `reserve` raises `ValueError` if `qty` is not positive or is more than `available(sku)`.
        - `release` raises `ValueError` if `qty` is not positive or is more than the units reserved for that SKU.
        - `remove(sku, qty)` must not take reserved units: it raises `ValueError` if `qty` is more than `available(sku)`.
      inventory/__init__.py: ""
      inventory/stock.py: |
        class Stock:
            """Tracks units on hand per SKU. See README.md for the reservation rules."""

            def __init__(self):
                self._on_hand = {}

            def add(self, sku, qty):
                if qty <= 0:
                    raise ValueError("qty must be positive")
                self._on_hand[sku] = self._on_hand.get(sku, 0) + qty

            def on_hand(self, sku):
                return self._on_hand.get(sku, 0)

            def remove(self, sku, qty):
                if qty <= 0:
                    raise ValueError("qty must be positive")
                if qty > self.on_hand(sku):
                    raise ValueError("not enough stock")
                self._on_hand[sku] -= qty
