        import runpy
        import sys
        from datetime import date

        from depot.cli import build_service, main
        from depot.errors import InvalidOrder, OutOfStock, UnknownSku
        from depot.models import OrderLine

        GROUPS = []
        MONDAY = date(2026, 3, 2)
        WAREHOUSES = ("leeds", "pune", "oslo")


        def group(fn):
            GROUPS.append(fn)
            return fn


        def eq(got, want, what=""):
            if got != want:
                raise AssertionError(f"{what}: got {got!r}, expected {want!r}")


        def raises(error, fn, what=""):
            try:
                fn()
            except error:
                return
            raise AssertionError(f"{what}: expected {error.__name__}")


        def stock(service, sku):
            return [service.inventory.on_hand(sku, w) for w in WAREHOUSES]


        def money(order):
            return (order.subtotal_pence, order.vat_pence, order.shipping_pence, order.total_pence)


        def total_line(text):
            return [line for line in text.splitlines() if line.startswith("Total:")]


        @group
        def existing_behaviour_unchanged():
            """The project's own checks (base_checks.py) still pass."""
            runpy.run_path("base_checks.py", run_name="__main__")

        @group
        def refused_express_order_takes_no_stock():
            s = build_service()
            raises(InvalidOrder, lambda: s.place_order("C-04", [OrderLine("TL-250", 2)], MONDAY, "express"))
            eq(stock(s, "TL-250"), [3, 3, 3])
            eq(len(s.orders), 0, "no order recorded")


        @group
        def unknown_method_takes_no_stock():
            s = build_service()
            raises(InvalidOrder, lambda: s.place_order("C-02", [OrderLine("EL-400", 4), OrderLine("TL-250", 1)], MONDAY, "pigeon"))
            eq((stock(s, "EL-400"), stock(s, "TL-250")), ([15, 15, 15], [3, 3, 3]))


        @group
        def the_next_order_is_not_affected():
            s = build_service()
            raises(InvalidOrder, lambda: s.place_order("C-04", [OrderLine("TL-250", 2)], MONDAY, "express"))
            order = s.place_order("C-04", [OrderLine("TL-250", 2)], MONDAY)
            eq((order.id, order.allocations), ("ORD-0001", [("TL-250", "leeds", 2)]))
            eq(money(order), (8464, 1946, 2495, 12905))


        @group
        def a_good_express_order_still_takes_stock():
            s = build_service()
            order = s.place_order("C-02", [OrderLine("TL-200", 6)], MONDAY, "express")
            eq(order.allocations, [("TL-200", "leeds", 5), ("TL-200", "pune", 1)])
            eq(stock(s, "TL-200"), [0, 11, 0])


        failed = []
        for fn in GROUPS:
            try:
                fn()
            except BaseException as e:
                failed.append(f"{fn.__name__}: {type(e).__name__}: {e}")
        for line in failed:
            print("FAIL", line)
        print(f"RESULT {len(GROUPS) - len(failed)}/{len(GROUPS)}")
        sys.exit(1 if failed else 0)
