        def two_new_prices():
            catalog = build_service().catalog
            eq(catalog.apply_price_list("sku,price\nTL-200,19.50\nBK-101,13\n"), (2, []))
            eq((catalog.get("TL-200").unit_price_pence, catalog.get("BK-101").unit_price_pence), (1950, 1300))


        failed = []
        for fn in GROUPS:
            try:
                fn()
            except BaseException as e:
                failed.append(f"{fn.__name__}: {type(e).__name__}: {e}")
        for line in failed:
            print("FAIL", line)
        print(f"RESULT {len(GROUPS) - len(failed)}/{len(GROUPS)}")
        sys.exit(1 if failed else 0)
