- id: js-deep-merge
  category: small_function
  thinking: off
  check: js_tests
  entry: deepMerge
  notes: The result must share no nested object with the inputs; undefined is ignored, null replaces; arrays replace.
  prompt: |
    Write a JavaScript function `deepMerge(base, override)` used to merge service
    configuration objects:
    - Return a new object. Never modify `base` or `override`, and the result must not share
      any nested object or array with them (changing the result must never change the inputs).
    - For each key in `override`: if both values are plain objects (not arrays, not null),
      merge them recursively; otherwise the `override` value replaces the base value
      (arrays are replaced, not concatenated).
    - An `undefined` value in `override` is ignored (the base value is kept); `null` does replace.
    - Keys that exist only in `base` are kept.

    Reply with one ```javascript code block containing the complete code.
    Keep any explanation short and put it after the code block.
  tests: |
    const base = { db: { host: "localhost", port: 5432, pool: { min: 1, max: 5 } }, tags: ["a"], debug: false };
    const over = { db: { port: 6543, pool: { max: 20 } }, tags: ["b", "c"], debug: undefined, region: null };
    const baseCopy = structuredClone(base);
    const overCopy = { db: { port: 6543, pool: { max: 20 } }, tags: ["b", "c"], debug: undefined, region: null };
    const merged = deepMerge(base, over);
    const plain = (v) => JSON.parse(JSON.stringify(v));  // prototype-agnostic (Object.create(null) is fine)
    assert.deepStrictEqual(plain(merged), {
      db: { host: "localhost", port: 6543, pool: { min: 1, max: 20 } },
      tags: ["b", "c"], debug: false, region: null,
    });
    assert.deepStrictEqual(base, baseCopy);
    assert.deepStrictEqual(over, overCopy);
    merged.db.pool.min = 99;
    merged.tags.push("z");
    assert.strictEqual(base.db.pool.min, 1);
    assert.deepStrictEqual(over.tags, ["b", "c"]);
    const onlyBase = { x: { y: 1 } };
    deepMerge(onlyBase, {}).x.y = 2;
    assert.strictEqual(onlyBase.x.y, 1, "result shares a nested object with base");
    assert.deepStrictEqual(deepMerge({ a: { b: 1 } }, { a: 5 }), { a: 5 });
    assert.deepStrictEqual(deepMerge({ a: 5 }, { a: { b: 1 } }), { a: { b: 1 } });
  reference: |
    ```javascript
    const isPlainObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);

    function clone(v) {
      if (Array.isArray(v)) return v.map(clone);
      if (isPlainObject(v)) return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, clone(x)]));
      return v;
    }

    function deepMerge(base, override) {
      const out = clone(base);
      for (const [key, value] of Object.entries(override)) {
        if (value === undefined) continue;
        out[key] = isPlainObject(value) && isPlainObject(out[key]) ? deepMerge(out[key], value) : clone(value);
      }
      return out;
    }
    ```
