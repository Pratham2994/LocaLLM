    ```python
    def _parse(v: str) -> tuple[int, int, int]:
        major, minor, patch = v.split(".")
        return int(major), int(minor), int(patch)


    def _comparator(version: tuple[int, int, int], comp: str) -> bool:
        if comp.startswith("^"):
            low = _parse(comp[1:])
            if low[0] > 0:
                high = (low[0] + 1, 0, 0)
            elif low[1] > 0:
                high = (0, low[1] + 1, 0)
            else:
                high = (0, 0, low[2] + 1)
            return low <= version < high
        if comp.startswith("~"):
            low = _parse(comp[1:])
            return low <= version < (low[0], low[1] + 1, 0)
        for op in (">=", "<=", ">", "<", "="):
            if comp.startswith(op):
                other = _parse(comp[len(op):])
                return {
                    ">=": version >= other, "<=": version <= other,
                    ">": version > other, "<": version < other, "=": version == other,
                }[op]
        return version == _parse(comp)


    def satisfies(version: str, range_: str) -> bool:
        v = _parse(version)
        return any(
            all(_comparator(v, comp) for comp in alternative.split())
            for alternative in range_.split("||")
        )
    ```
