- id: js-parse-query
  category: small_function
  thinking: off
  check: js_tests
  entry: parseQuery
  notes: Split on the FIRST '=' only; '+' means space; repeated keys become arrays.
  prompt: |
    Write a JavaScript function `parseQuery(qs)` for a Node.js API gateway. The input is a
    query string with or without a leading `?`. Return a plain object literal (`{}`):
    - Pairs are separated by `&`; key and value are separated by the FIRST `=`.
    - Decode `+` as a space, then percent-decode (`decodeURIComponent`) keys and values.
    - A key without `=` gets the value `""`.
    - A key that appears once gets a string; a key that appears more than once gets an
      array of all its values, in order.
    - Skip empty pairs (from `&&` or a trailing `&`).
    Do not use `URLSearchParams` or any library.

    Reply with one ```javascript code block containing the complete function.
    Keep any explanation short and put it after the code block.
  tests: |
    assert.deepStrictEqual(parseQuery(""), {});
    assert.deepStrictEqual(parseQuery("?"), {});
    assert.deepStrictEqual(parseQuery("?a=1&b=two"), { a: "1", b: "two" });
    assert.deepStrictEqual(parseQuery("tag=x&tag=y&tag=z"), { tag: ["x", "y", "z"] });
    assert.deepStrictEqual(parseQuery("q=hello+world%21&empty=&flag"), { q: "hello world!", empty: "", flag: "" });
    assert.deepStrictEqual(parseQuery("a=1&&b=2&"), { a: "1", b: "2" });
    assert.deepStrictEqual(parseQuery("expr=a%3Db%26c"), { expr: "a=b&c" });
    assert.deepStrictEqual(parseQuery("x=1=2"), { x: "1=2" });
    assert.deepStrictEqual(parseQuery("na%20me=J%C3%BCrgen"), { "na me": "Jürgen" });
  reference: |
    ```javascript
    function parseQuery(qs) {
      const out = {};
      const s = qs.startsWith("?") ? qs.slice(1) : qs;
      const decode = (x) => decodeURIComponent(x.replace(/\+/g, " "));
      for (const pair of s.split("&")) {
        if (pair === "") continue;
        const i = pair.indexOf("=");
        const key = decode(i === -1 ? pair : pair.slice(0, i));
        const value = decode(i === -1 ? "" : pair.slice(i + 1));
        if (Object.prototype.hasOwnProperty.call(out, key)) {
          out[key] = Array.isArray(out[key]) ? [...out[key], value] : [out[key], value];
        } else {
          out[key] = value;
        }
      }
      return out;
    }
    ```
  wrong: |
    ```javascript
