  prompt: |
    Write a Python function `parse_date(text: str) -> datetime.date` for an invoicing service.
    It must accept exactly these three formats:
    - ISO: `2025-03-07`
    - British numeric: `07/03/2025` (day/month/year)
    - Short text: `7 Mar 2025` (English three-letter month; day with or without a leading zero)
    Surrounding whitespace is allowed. Any other input, including impossible dates such as
