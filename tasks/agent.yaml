      config/parse.py: |
        import re

        _KEY = re.compile(r"^[A-Z_][A-Z0-9_]*$")


        def parse_env(text):
            """Parse the text of a .env file into a dict of strings (rules: see the task)."""
            result = {}
            for number, raw in enumerate(text.splitlines(), 1):
                line = raw.strip()
                if not line or line.startswith("#"):
                    continue
                if line.startswith("export "):
                    line = line[len("export "):].lstrip()
                if "=" not in line:
                    raise ValueError(f"line {number}: missing '='")
                key, value = line.split("=", 1)
                key, value = key.strip(), value.strip()
                if not _KEY.match(key):
                    raise ValueError(f"line {number}: invalid key {key!r}")
                if len(value) >= 2 and value[0] == value[-1] == '"':
                    value = value[1:-1]
                result[key] = value
            return result
    notes: >-
      Code from a written spec with nine rules. The visible tests cover four of them; the rest (export, `=` in a
      value, key rules, line numbers that count blank lines) are in the docstring only.

