  - id: ag-depot-coupon
    kind: repo
    category: agent-project-feature
    lang: python
    base: depot
    max_steps: 50
    prompt: Implement the coupon feature that README.md describes in its section "Coupons". run_tests.py shows a small part of the expected behaviour.
    mutate: &id020
    - path: README.md
      old: |
        ### Reports
      new: |
        ### Coupons

        - `place_order(customer_id, lines, placed_on, method="standard", coupon=None)` takes an optional coupon code.
        - The known codes are in `pricing.COUPONS`: `SPRING10` gives 10 %, `TRADE5` gives 5 %.
        - The coupon percentage is added to the volume and tier percentages of every line. The sum is capped at 30 %.
        - An unknown code raises `InvalidOrder`, and no stock is taken.
        - The order stores the code in `Order.coupon` (`None` when no coupon was used). `storage.order_to_dict` writes it
          under the key `coupon` and `storage.order_from_dict` reads it back.
        - The invoice has the line `Coupon: SPRING10` directly after the `Date:` line when a coupon was used, and no such
          line otherwise.
        - The command line takes it as `quote ... --coupon CODE`.

        ### Reports
