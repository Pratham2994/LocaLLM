        function slugify(text) {
          return text.trim().toLowerCase().split(/\s+/).join('-');
        }

        function truncate(text, max) {
          return text.length <= max ? text : text.slice(0, max - 1) + '…';
        }

        module.exports = { slugify, truncate };
      run_tests.cjs: |
