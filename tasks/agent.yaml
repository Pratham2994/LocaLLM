# Agent tier (LOCAL_LLM_LAB.md 9.11). Made-up code and data only.
#
# kind: tool  -> scripted tools with canned results; graded on the calls and the final answer.
#   tools:   name, description, parameters (JSON schema), returns (default result),
#            results: [{when: {arg: value}, returns: text}] (first match wins)
#   expect:  calls [{tool, args}] (each must be matched by a call; `ordered: true` = in this order),
#            forbid [tool names], max_calls, min_calls, final_contains (an item that is a list = any one),
#            final_not_contains, final_regex
#            argument matchers: {"$contains": text} {"$regex": pattern} {"$exact": value} {"$any": [options]}
#   A call to a tool that was not offered, or with arguments that are not valid, always fails the task.
#   reference / wrong: {calls: [{tool, args}], final: text} -> `lab agent --selftest` must pass / fail them.
#
# kind: repo  -> `files` are written to a temp folder; the model gets list_files, read_file, search,
#   write_file, edit_file, run_tests. Graded by the `hidden` files (run_tests.py or run_tests.cjs)
#   written over a copy of the folder. reference: {path: new full content} must pass both test files.
#   The hidden tests only check what the prompt, the README or the docstrings state.
#   base: <name>   -> start from the shared project tasks/projects/<name>/ (the task's `files` go over it;
#                     the task must bring its own run_tests file, so the project's full test file is not shown)
#   mutate: [{path, old, new}] -> text changes that inject the fault (each `old` must occur exactly once)
#   reference values may also be "@base" (the base project's file) or {patch: [{old, new}]}.

tasks:

  # ============================================================ level 1: tool calls

  - id: tc-single-call
    kind: tool
    category: tool-call
    prompt: Where is my order A-1042?
    tools:
      - name: get_order_status
        description: Look up the shipping status of one order.
        parameters: {type: object, properties: {order_id: {type: string, description: "Order id, e.g. A-1001"}}, required: [order_id]}
        returns: "Order A-1042: shipped on 2026-03-14 with courier Bluefinch, tracking number BF-77120."
    expect:
      calls: [{tool: get_order_status, args: {order_id: "A-1042"}}]
      max_calls: 1
      final_contains: [shipped, [Bluefinch, BF-77120]]
    reference:
      calls: [{tool: get_order_status, args: {order_id: "A-1042"}}]
      final: Your order A-1042 was shipped on 14 March 2026 with Bluefinch, tracking number BF-77120.
    wrong:
      calls: []
      final: Your order was shipped with Bluefinch.
    notes: The simplest case. One tool, one obvious argument, then an answer from the result.

  - id: tc-choose-tool
    kind: tool
    category: tool-call
    prompt: How many US dollars do I get for one euro right now?
    tools:
      - name: get_order_status
        description: Look up the shipping status of one order.
        parameters: {type: object, properties: {order_id: {type: string}}, required: [order_id]}
        returns: "ERROR: unknown order"
      - name: cancel_order
        description: Cancel an order that has not shipped yet.
        parameters: {type: object, properties: {order_id: {type: string}, reason: {type: string}}, required: [order_id]}
        returns: "ERROR: unknown order"
      - name: list_invoices
        description: List the invoices of one customer for one year.
        parameters: {type: object, properties: {customer_id: {type: string}, year: {type: integer}}, required: [customer_id, year]}
        returns: "[]"
      - name: get_exchange_rate
        description: Current exchange rate between two currencies.
        parameters:
          type: object
          properties:
            base: {type: string, description: "ISO code of the currency you have, e.g. GBP. The rate is for 1 unit of it."}
            quote: {type: string, description: "ISO code of the currency you want, e.g. INR"}
          required: [base, quote]
        returns: "ERROR: unsupported currency pair"
        results:
          - when: {base: EUR, quote: USD}
            returns: "1 EUR = 1.0837 USD (rate time 2026-04-02 09:00 UTC)"
      - name: create_ticket
        description: Open a support ticket.
        parameters: {type: object, properties: {subject: {type: string}, body: {type: string}}, required: [subject, body]}
        returns: "ticket T-1 created"
    expect:
      calls: [{tool: get_exchange_rate, args: {base: EUR, quote: USD}}]
      forbid: [get_order_status, cancel_order, list_invoices, create_ticket]
      max_calls: 1
      final_contains: [["1.0837", "1.084", "1.08"]]   # a rounded rate is a correct answer
    reference:
      calls: [{tool: get_exchange_rate, args: {base: EUR, quote: USD}}]
      final: One euro is 1.0837 US dollars at the moment.
    wrong:
      calls: [{tool: get_exchange_rate, args: {base: USD, quote: EUR}}]
      final: One euro is about 1.08 dollars.
    notes: Five tools, one fits. The arguments have a direction (base EUR, quote USD); swapped arguments fail.

  - id: tc-no-tool-needed
    kind: tool
    category: tool-call
    prompt: What is the capital of Japan? Answer in one word.
    tools:
      - name: get_order_status
        description: Look up the shipping status of one order.
        parameters: {type: object, properties: {order_id: {type: string}}, required: [order_id]}
        returns: "ERROR: unknown order"
      - name: get_exchange_rate
        description: Current exchange rate between two currencies.
        parameters: {type: object, properties: {base: {type: string}, quote: {type: string}}, required: [base, quote]}
        returns: "ERROR: unsupported currency pair"
      - name: search_handbook
        description: Search the company handbook.
        parameters: {type: object, properties: {query: {type: string}}, required: [query]}
        returns: "no results"
    expect:
      max_calls: 0
      final_contains: [Tokyo]
    reference:
      calls: []
      final: Tokyo
    wrong:
      calls: [{tool: search_handbook, args: {query: capital of Japan}}]
      final: Tokyo
    notes: Tools are offered but none is needed. A model that calls a tool anyway fails.

  - id: tc-args-types
    kind: tool
    category: tool-call
    prompt: >-
      Book a 45 minute online meeting called "Sprint review" with asha@northwind.test and
      ben@northwind.test. It is high priority. Then tell me the meeting id.
    tools:
      - name: create_meeting
        description: Create a calendar meeting.
        parameters:
          type: object
          properties:
            title: {type: string}
            duration_minutes: {type: integer}
            attendees: {type: array, items: {type: string}, description: "Email addresses"}
            online: {type: boolean, description: "true for a video call, false for a room"}
            priority: {type: string, enum: [low, normal, high]}
          required: [title, duration_minutes, attendees, online, priority]
        returns: "Meeting created. id: M-2291"
    expect:
      calls:
        - tool: create_meeting
          args:
            title: Sprint review
            duration_minutes: 45
            attendees: {"$any": [[asha@northwind.test, ben@northwind.test], [ben@northwind.test, asha@northwind.test]]}
            online: true
            priority: high
      max_calls: 1
      final_contains: [M-2291]
    reference:
      calls:
        - tool: create_meeting
          args: {title: Sprint review, duration_minutes: 45, attendees: [asha@northwind.test, ben@northwind.test], online: true, priority: high}
      final: The meeting is booked. Its id is M-2291.
    wrong:
      calls:
        - tool: create_meeting
          args: {title: Sprint review, duration_minutes: "45", attendees: "asha@northwind.test, ben@northwind.test", online: "true", priority: high}
      final: The meeting is booked. Its id is M-2291.
    notes: Argument types. An integer, a boolean, an array and an enum; strings in their place fail.

  - id: tc-two-step
    kind: tool
    category: tool-call
    prompt: Which invoice of the customer Farah Qureshi is overdue? Give me the invoice number.
    tools:
      - name: find_customer
        description: Find customers by name. Returns a JSON list with their ids.
        parameters: {type: object, properties: {name: {type: string}}, required: [name]}
        returns: '[{"id": "C-5531", "name": "Farah Qureshi", "city": "Leeds"}]'
      - name: get_invoices
        description: List the invoices of one customer.
        parameters: {type: object, properties: {customer_id: {type: string, description: "Customer id, e.g. C-1000"}}, required: [customer_id]}
        returns: "ERROR: unknown customer id"
        results:
          - when: {customer_id: C-5531}
            returns: '[{"invoice": "INV-9004", "amount_pence": 18250, "status": "overdue"}, {"invoice": "INV-9017", "amount_pence": 4200, "status": "paid"}]'
    expect:
      ordered: true
      calls:
        - {tool: find_customer, args: {name: {"$contains": Farah}}}
        - {tool: get_invoices, args: {customer_id: C-5531}}
      max_calls: 3
      final_contains: [INV-9004]
    reference:
      calls:
        - {tool: find_customer, args: {name: Farah Qureshi}}
        - {tool: get_invoices, args: {customer_id: C-5531}}
      final: Invoice INV-9004 is overdue.
    wrong:
      calls:
        - {tool: get_invoices, args: {customer_id: Farah Qureshi}}
      final: Invoice INV-9004 is overdue.
    notes: The second call needs the id that the first call returns. Guessing the id fails.

  - id: tc-parallel
    kind: tool
    category: tool-call
    prompt: What is the temperature in Pune, Leeds and Oslo right now? Which of the three is the coldest?
    tools:
      - name: get_weather
        description: Current weather for one city.
        parameters: {type: object, properties: {city: {type: string}}, required: [city]}
        returns: "ERROR: unknown city"
        results:
          - {when: {city: {"$contains": Pune}}, returns: "Pune: 31 C, clear"}
          - {when: {city: {"$contains": Leeds}}, returns: "Leeds: 9 C, rain"}
          - {when: {city: {"$contains": Oslo}}, returns: "Oslo: -2 C, snow"}
    expect:
      calls:
        - {tool: get_weather, args: {city: {"$contains": Pune}}}
        - {tool: get_weather, args: {city: {"$contains": Leeds}}}
        - {tool: get_weather, args: {city: {"$contains": Oslo}}}
      max_calls: 3
      final_contains: [Oslo, "31", "9"]
      final_regex: ['[-−–]\s?2']
    reference:
      calls:
        - {tool: get_weather, args: {city: Pune}}
        - {tool: get_weather, args: {city: Leeds}}
        - {tool: get_weather, args: {city: Oslo}}
      final: Pune is at 31 C, Leeds at 9 C and Oslo at -2 C. Oslo is the coldest.
    wrong:
      calls:
        - {tool: get_weather, args: {city: Pune}}
      final: Pune is at 31 C. Oslo is usually the coldest, around -2 C.
    notes: Three independent calls, in one turn or one after the other. All three results must be used.

  - id: tc-use-result
    kind: tool
    category: tool-call
    prompt: According to our company handbook, how many days of annual leave does a full-time employee get?
    tools:
      - name: search_handbook
        description: Search the company handbook and return the matching section.
        parameters: {type: object, properties: {query: {type: string}}, required: [query]}
        returns: "Handbook section 4.2 (Leave): full-time employees get 23.5 days of annual leave per year. Part-time staff get the same pro rata."
    expect:
      calls: [{tool: search_handbook}]
      max_calls: 2
      final_contains: ["23.5"]
    reference:
      calls: [{tool: search_handbook, args: {query: annual leave days}}]
      final: The handbook gives full-time employees 23.5 days of annual leave per year.
    wrong:
      calls: []
      final: Full-time employees usually get 25 days of annual leave.
    notes: The answer is an unusual number that only the tool knows. Answering from memory fails.

  - id: tc-error-recovery
    kind: tool
    category: tool-call
    prompt: Read the file config/app.yml and tell me the server port.
    tools:
      - name: read_file
        description: Return the text of one project file.
        parameters: {type: object, properties: {path: {type: string}}, required: [path]}
        returns: "ERROR: no such file. Files in config/: app.yaml, logging.yaml"
        results:
          - when: {path: config/app.yaml}
            returns: "server:\n  host: 0.0.0.0\n  port: 8421\n  workers: 6\n"
          - when: {path: config/logging.yaml}
            returns: "level: info\nfile: logs/app.log\n"
    expect:
      ordered: true
      calls:
        - {tool: read_file, args: {path: config/app.yml}}
        - {tool: read_file, args: {path: config/app.yaml}}
      max_calls: 3
      final_contains: ["8421"]
    reference:
      calls:
        - {tool: read_file, args: {path: config/app.yml}}
        - {tool: read_file, args: {path: config/app.yaml}}
      final: The file is named config/app.yaml. The server port is 8421.
    wrong:
      calls:
        - {tool: read_file, args: {path: config/app.yml}}
      final: The file config/app.yml does not exist.
    notes: The first call fails with a hint (the file is app.yaml). The model must try again, not give up.

  - id: tc-escaping
    kind: tool
    category: tool-call
    prompt: |-
      Create the file notes/quote.txt with exactly these two lines:

      He said: "use C:\temp\new" and left.
      Path with 100% {braces} and 'single' quotes.
    tools:
      - name: write_file
        description: Create a file or replace its whole content.
        parameters: {type: object, properties: {path: {type: string}, content: {type: string}}, required: [path, content]}
        returns: "wrote the file"
    expect:
      calls:
        - tool: write_file
          args:
            path: notes/quote.txt
            content:
              "$any":
                - {"$exact": "He said: \"use C:\\temp\\new\" and left.\nPath with 100% {braces} and 'single' quotes."}
                - {"$exact": "He said: \"use C:\\temp\\new\" and left.\nPath with 100% {braces} and 'single' quotes.\n"}
      max_calls: 1
    reference:
      calls:
        - tool: write_file
          args:
            path: notes/quote.txt
            content: "He said: \"use C:\\temp\\new\" and left.\nPath with 100% {braces} and 'single' quotes.\n"
      final: I created notes/quote.txt.
    wrong:
      calls:
        - tool: write_file
          args:
            path: notes/quote.txt
            content: "He said: \"use C:\temp\new\" and left.\nPath with 100% {braces} and 'single' quotes.\n"
      final: I created notes/quote.txt.
    notes: >-
      JSON escaping. The text holds double quotes and the backslash sequences \t and \n as plain characters.
      A model that turns them into a tab and a line break (the `wrong` answer) fails.

