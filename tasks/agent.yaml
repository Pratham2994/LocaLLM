        """Checks for this task. Each @group function is one rule. Prints RESULT passed/total."""
        import runpy
        import sys
        from datetime import date

        from depot.cli import build_service, main
        from depot.errors import InvalidOrder, OutOfStock, UnknownSku
        from depot.models import OrderLine

        GROUPS = []
        MONDAY = date(2026, 3, 2)
        WAREHOUSES = ("leeds", "pune", "oslo")


        def group(fn):
            GROUPS.append(fn)
            return fn


        def eq(got, want, what=""):
            if got != want:
                raise AssertionError(f"{what}: got {got!r}, expected {want!r}")


        def raises(error, fn, what=""):
            try:
                fn()
            except error:
                return
            raise AssertionError(f"{what}: expected {error.__name__}")


        def stock(service, sku):
            return [service.inventory.on_hand(sku, w) for w in WAREHOUSES]


        def money(order):
            return (order.subtotal_pence, order.vat_pence, order.shipping_pence, order.total_pence)


        def total_line(text):
            return [line for line in text.splitlines() if line.startswith("Total:")]


        @group
        def existing_behaviour_unchanged():
            """The project's own checks (base_checks.py) still pass."""
            runpy.run_path("base_checks.py", run_name="__main__")

        @group
        def book_first():
            s = build_service()
            order = s.place_order("C-02", [OrderLine("BK-101", 1), OrderLine("TL-200", 1)], MONDAY)
            eq((order.subtotal_pence, order.vat_pence), (3194, 379))


        @group
        def saw_first():
            s = build_service()
            order = s.place_order("C-02", [OrderLine("TL-200", 1), OrderLine("BK-101", 1)], MONDAY)
            eq((order.subtotal_pence, order.vat_pence), (3194, 379))


        @group
        def vat_of_the_order_is_the_sum_of_the_lines():
            s = build_service()
            order = s.place_order("C-01", [OrderLine("BK-102", 2), OrderLine("TL-210", 3), OrderLine("EL-400", 7)], MONDAY)
            eq(order.vat_pence, sum(line.vat_pence for line in order.lines))
            eq(order.total_pence, order.subtotal_pence + order.vat_pence + order.shipping_pence)


        @group
        def each_line_is_rounded_down_on_its_own():
            s = build_service()
            order = s.place_order("C-04", [OrderLine("TL-210", 1), OrderLine("EL-400", 1)], MONDAY)   # IE, 23 %
            eq([line.vat_pence for line in order.lines], [198, 243])
            eq(order.vat_pence, 441, "198 + 243, not 23 % of the subtotal (442)")


        @group
        def invoice_vat_line():
            out = main(["quote", "C-02", "BK-101:1", "TL-200:1"])
            eq([line for line in out.splitlines() if line.startswith("VAT:")], ["VAT: £3.79"])


        failed = []
        for fn in GROUPS:
            try:
                fn()
            except BaseException as e:
                failed.append(f"{fn.__name__}: {type(e).__name__}: {e}")
        for line in failed:
            print("FAIL", line)
        print(f"RESULT {len(GROUPS) - len(failed)}/{len(GROUPS)}")
        sys.exit(1 if failed else 0)
