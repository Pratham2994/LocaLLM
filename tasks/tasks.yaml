  prompt: |
    Write a Python function `build_order(deps: dict[str, list[str]]) -> list[str]` for a
    build tool. `deps` maps each target to the list of targets it depends on.

    - Return every target exactly once, each one after all of its dependencies. A name that
      appears only inside a dependency list is also a target (with no dependencies).
    - The order must be deterministic: at every step, output the alphabetically smallest
      target whose dependencies have all been output already.
    - If the dependencies contain a cycle (including a target that depends on itself),
      raise `ValueError`.

    Use only the standard library. Reply with one ```python code block containing the
    complete code. Keep any explanation short and put it after the code block.
  tests: |
    assert build_order({}) == []
    assert build_order({"app": []}) == ["app"]
    assert build_order({"app": ["lib"], "lib": ["core"]}) == ["core", "lib", "app"]
    assert build_order({"b": ["a"], "c": [], "a": []}) == ["a", "b", "c"], "smallest ready target at every step"
    assert build_order({"app": ["lib", "zeta"], "lib": [], "alpha": ["zeta"]}) == ["lib", "zeta", "alpha", "app"]
    assert build_order({"z": [], "m": ["z"], "a": ["m"], "b": []}) == ["b", "z", "m", "a"]
    assert build_order({"x": ["y", "y"], "y": []}) == ["y", "x"], "a repeated dependency is fine"
    for bad in [{"a": ["a"]}, {"a": ["b"], "b": ["a"]}, {"a": ["b"], "b": ["c"], "c": ["a"], "d": []}]:
        try:
            build_order(bad)
        except ValueError:
            pass
        else:
            raise AssertionError(f"no ValueError for {bad!r}")
    d = {"b": ["a"], "a": []}
    build_order(d)
    assert d == {"b": ["a"], "a": []}, "the input must not be changed"
  reference: |
    ```python
    import heapq


    def build_order(deps: dict[str, list[str]]) -> list[str]:
        needs = {target: set(ds) for target, ds in deps.items()}
        for ds in deps.values():
            for d in ds:
                needs.setdefault(d, set())
        users: dict[str, list[str]] = {t: [] for t in needs}
        for target, ds in needs.items():
            for d in ds:
                users[d].append(target)
        ready = [t for t, ds in needs.items() if not ds]
        heapq.heapify(ready)
        order = []
        while ready:
            t = heapq.heappop(ready)
            order.append(t)
            for u in users[t]:
                needs[u].discard(t)
                if not needs[u]:
                    heapq.heappush(ready, u)
        if len(order) != len(needs):
            raise ValueError("dependency cycle")
        return order
    ```
