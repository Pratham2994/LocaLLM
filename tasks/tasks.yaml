  reference: |
    ```cpp
    #include <cctype>
    #include <string>

    long long parse_duration(const std::string& s) {
        if (s.empty()) return -1;
        const std::string units = "hms";
        const long long factor[] = {3600, 60, 1};
        long long total = 0;
        std::size_t i = 0;
        std::size_t next_unit = 0;  // first unit still allowed
        while (i < s.size()) {
            std::size_t start = i;
            long long n = 0;
            while (i < s.size() && std::isdigit(static_cast<unsigned char>(s[i]))) {
                n = n * 10 + (s[i] - '0');
                ++i;
            }
            if (i == start || i == s.size()) return -1;
            std::size_t u = units.find(s[i]);
            if (u == std::string::npos || u < next_unit) return -1;
            total += n * factor[u];
            next_unit = u + 1;
            ++i;
        }
        return total;
    }

    int main() { return parse_duration("1h") == 3600 ? 0 : 1; }
    ```
  wrong: |
    ```cpp
    #include <cctype>
    #include <string>

    long long parse_duration(const std::string& s) {
        if (s.empty()) return -1;
        long long total = 0, n = 0;
        bool digits = false;
        for (char c : s) {
            if (std::isdigit(static_cast<unsigned char>(c))) { n = n * 10 + (c - '0'); digits = true; continue; }
            if (!digits) return -1;
            if (c == 'h') total += n * 3600;
            else if (c == 'm') total += n * 60;
            else if (c == 's') total += n;
            else return -1;
            n = 0; digits = false;
        }
        return digits ? -1 : total;
    }
    ```

