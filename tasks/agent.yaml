    lang: js
    prompt: Add the `titleCase` function that README.md describes to src/text.js and export it. Keep the existing functions.
    files:
      README.md: |
        # text helpers

        ## titleCase(text)

        - Words are separated by spaces. Several spaces count as one. The result has single spaces
          between the words and no spaces at its ends.
        - Each word gets an upper-case first letter; the rest of the word becomes lower-case.
        - The small words `a`, `an`, `the`, `of`, `and`, `in` stay fully lower-case, except when
          they are the first word.
        - An empty string, or a string of spaces only, gives an empty string.
