    int main() {
        CHECK(parse_duration("1h30m") == 5400);
        CHECK(parse_duration("45s") == 45);
        CHECK(parse_duration("2h") == 7200);
        CHECK(parse_duration("1h0m5s") == 3605);
        CHECK(parse_duration("90m") == 5400);
        CHECK(parse_duration("") == -1);
        CHECK(parse_duration("10") == -1);
        CHECK(parse_duration("h") == -1);
        CHECK(parse_duration("5m1h") == -1);
        CHECK(parse_duration("1h1h") == -1);
