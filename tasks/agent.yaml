    mutate: &id024
    - path: README.md
      old: |
        ### Reports
      new: |
        ### Returns

        - `OrderService.return_items(order_id, items)` takes back units of a delivered order. `items` is a list of
          `OrderLine(sku, qty)`.
        - Only an order with the status `delivered` or `part-returned` can have returns; any other status raises `InvalidOrder`.
        - Every SKU in `items` must be a line of the order and may appear only once in `items`. Each quantity must be a
          whole number of 1 or more. Together with earlier returns, the returned quantity of a line must not be more than its
          ordered quantity. Any breach raises `InvalidOrder`, and then nothing at all is changed.
        - Returned units always go to the `leeds` warehouse, wherever they were picked from.
        - The refund of a line = line total x returned quantity / ordered quantity, rounded down, plus the VAT of the line
          x returned quantity / ordered quantity, rounded down. Shipping is never refunded. `return_items` returns the
          refund of this call in pence (the sum over its lines).
        - The order keeps a record: `Order.returned` is a dict `{sku: units returned so far}` (empty for a new order), and
          `Order.refunded_pence` is the sum of all refunds so far (0 for a new order).
        - When every unit of every line has been returned, the status becomes `returned`; otherwise `part-returned`.
        - `storage.order_to_dict` writes the keys `returned` and `refunded_pence`, and `storage.order_from_dict` reads them back.
        - Reports: `top_products` counts ordered units minus returned units and leaves out a SKU with no units left.
          The other reports do not change.

        ### Reports
